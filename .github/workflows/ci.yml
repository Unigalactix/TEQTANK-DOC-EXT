name: CI Pipeline - Unigalactix/TEQTANK-DOC-EXT

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CI: true
  BUILD_COMMAND: pip install -r requirements.txt
  TEST_COMMAND: pytest
  CODEQL_LANGUAGE: python

jobs:

  # -------------------------------------------------
  # JOB 1: BUILD & TEST
  # -------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          ${{ env.BUILD_COMMAND }}

      - name: Test
        run: ${{ env.TEST_COMMAND }}
        continue-on-error: true

  # -------------------------------------------------
  # JOB 2: SECURITY SCANS
  # -------------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ env.CODEQL_LANGUAGE }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # -------------------------------------------------
  # JOB 3: DOCKER BUILD & PUSH
  # -------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: [build, security-scan]

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase repo name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_LOWER }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_LOWER }}:${{ github.sha }}

  # -------------------------------------------------
  # JOB 4: DEPLOY (Publish Profile, Image-based)
  # -------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    environment: 'Production'

    steps:
      - name: Compute lowercase repo name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_LOWER }}:${{ github.sha }}
